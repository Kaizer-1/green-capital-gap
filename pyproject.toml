[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "green-capital-gap"
version = "1.0.0"
description = "Deal-level analysis of cleantech venture funding in emerging economies, 2000-2012"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
]
# Kaggle CLI is optional: the ingest stage stops and asks rather than
# substituting data if credentials are absent (CLAUDE.md §2.1, §15).
kaggle = ["kaggle>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 95
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PD", "RET", "PTH"]
ignore = [
    "PD010",  # pivot is sometimes the clearest option
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    # CLAUDE.md §12: warnings are errors. A SettingWithCopyWarning left
    # unresolved is a silent correctness bug.
    "error",
    "error::FutureWarning",
    "error::DeprecationWarning",
]
