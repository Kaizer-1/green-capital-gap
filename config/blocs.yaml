# --------------------------------------------------------------------------
# Crunchbase country_code quirks. The snapshot is nominally ISO-3166-1 alpha-3
# but carries withdrawn (ISO-3166-3) codes and blanks. Every code that fails to
# map is LOGGED, never silently dropped (CLAUDE.md §5). This map is seeded with
# the codes known in advance; build step 4 prints the unmapped log and any
# further codes are added here with a reason.
# --------------------------------------------------------------------------
code_overrides:
  ROM: {to: ROU, reason: "ISO-3166-3 withdrawn code for Romania."}
  TMP: {to: TLS, reason: "ISO-3166-3 withdrawn code for East Timor / Timor-Leste."}
  ZAR: {to: COD, reason: "ISO-3166-3 withdrawn code for Zaire."}
  BUR: {to: MMR, reason: "ISO-3166-3 withdrawn code for Burma."}
  YUG: {to: SRB, reason: "ISO-3166-3 Yugoslavia. Mapped to Serbia as the successor with the continuing World Bank series. An approximation; flagged in the methodology."}
  SCG: {to: SRB, reason: "ISO-3166-3 Serbia and Montenegro. Mapped to Serbia; same approximation as YUG."}

  # Overseas departments and territories that Crunchbase lists as if they were
  # sovereign states. Each is mapped to the metropolitan state whose World Bank
  # series governs it. Found empirically in the step-4 unmapped log; 11 deals in
  # total, so the choice is immaterial to any result, but a silent drop is not
  # acceptable.
  GLP: {to: FRA, reason: "Guadeloupe is a French overseas department with no separate World Bank series."}
  REU: {to: FRA, reason: "Reunion is a French overseas department with no separate World Bank series."}
  UMI: {to: USA, reason: "United States Minor Outlying Islands; no separate World Bank series."}

# World Bank API and OWID series use a few non-ISO codes of their own.
world_bank_code_aliases:
  XKX: {to: XKX, reason: "World Bank code for Kosovo. No ISO-3166-1 alpha-3 exists; retained as-is."}

# Codes that are World Bank REGIONAL AGGREGATES, not countries. Their presence
# in a company's country_code field is an upstream data error. They are counted
# and excluded from country-level panels rather than mapped to a bloc, because
# mapping an aggregate to a bloc would double-count. Found in the step-4 log.
aggregate_codes_in_source:
  CSS: {reason: "World Bank aggregate: Caribbean small states. Not a country."}
  PST: {reason: "World Bank aggregate: Pacific island small states. Not a country."}
  FST: {reason: "Non-standard code with no ISO-3166 or World Bank match. Treated as unknown."}

# --------------------------------------------------------------------------
# Economies with no World Bank income classification, or with one the historical
# series does not cover. Each needs an explicit, reasoned assignment rather than
# a silent drop. These are assertions and are listed in Appendix B.
# --------------------------------------------------------------------------
income_overrides:
  TWN:
    bloc: AE
    income_group: high_income
    from: 2000
    reason: >
      Taiwan is not a World Bank member and receives no income classification.
      It is classified as an advanced economy by the IMF and is a developed
      market in every major index provider's scheme. Material: Taiwan is a
      non-trivial share of Asian venture deals in this snapshot, so dropping it
      would bias the AE/EM split.
  PRI:
    bloc: AE
    income_group: high_income
    from: 2000
    reason: "Puerto Rico is classified high-income by the World Bank. Included explicitly because the historical series has gaps for territories."

# Codes that are not countries and are excluded from country-level panels with
# a logged count. Crunchbase leaves country_code blank for a large number of
# companies; that is an attrition-ledger line, not an override.
non_country_codes:
  - ""
  - "UNKNOWN"

# --------------------------------------------------------------------------
# Robustness alternative (a): static present-day classification.
# Every headline result is re-run using each country's CURRENT income group for
# all years, to show whether time-varying assignment changes conclusions.
# Resolved at runtime from the World Bank country-metadata endpoint, so no list
# is hard-coded here.
# --------------------------------------------------------------------------
robustness_static:
  source: wb_country_meta
  description: "Present-day World Bank income level applied to all deal years."

# --------------------------------------------------------------------------
# Robustness alternative (b): MSCI Emerging Markets constituent list.
# The standard MSCI EM index, 24 markets. Note the scheme's own quirks: it
# treats Korea and Taiwan as emerging while the World Bank treats both as
# high-income, and it includes China. Reported as an appendix comparison only.
# --------------------------------------------------------------------------
robustness_msci_em:
  as_of: 2025
  include_china: true
  codes:
    - {code: BRA, name: Brazil}
    - {code: CHL, name: Chile}
    - {code: CHN, name: China}
    - {code: COL, name: Colombia}
    - {code: CZE, name: Czechia}
    - {code: EGY, name: Egypt}
    - {code: GRC, name: Greece}
    - {code: HUN, name: Hungary}
    - {code: IND, name: India}
    - {code: IDN, name: Indonesia}
    - {code: KOR, name: Korea, Rep.}
    - {code: KWT, name: Kuwait}
    - {code: MYS, name: Malaysia}
    - {code: MEX, name: Mexico}
    - {code: PER, name: Peru}
    - {code: PHL, name: Philippines}
    - {code: POL, name: Poland}
    - {code: QAT, name: Qatar}
    - {code: SAU, name: Saudi Arabia}
    - {code: ZAF, name: South Africa}
    - {code: TWN, name: Taiwan}
    - {code: THA, name: Thailand}
    - {code: TUR, name: Turkiye}
    - {code: ARE, name: United Arab Emirates}
  excluded_notes:
    - "Argentina: reclassified to standalone market in 2021."
    - "Pakistan: moved to Frontier Markets in 2021."
    - "Russia: removed from the index in 2022."

# --------------------------------------------------------------------------
# Reporting order and display labels for figures and tables.
# --------------------------------------------------------------------------
display:
  order: [AE, CHINA, EM, LDC]
  labels:
    AE: "Advanced economies"
    CHINA: "China"
    EM: "Emerging markets (ex-China, ex-LDC)"
    LDC: "Least developed countries"
    UNASSIGNED: "Unassigned"

# --------------------------------------------------------------------------
# Country recovery for rows with a blank country_code.
#
# 2,160 in-window deal rows (1,650 companies) carry no country_code at all —
# a bucket larger than the entire emerging-market bloc, so leaving it
# unresolved would mean discarding the single largest block of potentially
# emerging-market evidence in the dataset.
#
# city, state_code and region are ALSO entirely blank for these companies
# (region is the literal string "unknown"), so geographic recovery from the
# relational dump is impossible. Two routes remain, applied in this order of
# authority.
# --------------------------------------------------------------------------
country_recovery:
  # Route 1, authoritative: the flat mirror's own country_code for the same
  # company. Same underlying database, a later vintage, so a country present
  # there is a Crunchbase assertion rather than an inference.
  use_flat_mirror: true

  # Route 2, weak inference: a country-code top-level domain. Accepted ONLY
  # for the ccTLDs below, which are used geographically rather than as vanity
  # domains. Every recovery by this route is flagged in the data so results can
  # be re-run without it.
  use_cctld: true
  cctld_to_iso3:
    ru: RUS
    uk: GBR
    de: DEU
    br: BRA
    it: ITA
    us: USA
    cn: CHN
    fr: FRA
    in: IND
    jp: JPN
    nl: NLD
    ca: CAN
    es: ESP
    tw: TWN
    dk: DNK
    il: ISR
    ae: ARE
    mx: MEX
    ie: IRL
    ro: ROU
    za: ZAF
    nz: NZL
    ge: GEO
    pl: POL
    ar: ARG
    cl: CHL
    az: AZE
    md: MDA
    li: LIE

  # TLDs explicitly REFUSED as country evidence. This list is the point of the
  # whole exercise: several of these belong to emerging or least-developed
  # countries and are sold as vanity domains worldwide. Accepting them would
  # FABRICATE emerging-market and LDC deals out of domain-name marketing —
  # inventing 9 Tuvaluan (LDC) ventures from `.tv` alone. A naive TLD recovery
  # would have manufactured exactly the evidence this project is looking for,
  # which is the strongest possible reason to enumerate the refusals.
  cctld_refused:
    com: "Generic. No geographic content."
    net: "Generic."
    org: "Generic."
    info: "Generic."
    biz: "Generic."
    mobi: "Generic."
    eu: "Supranational, not a country."
    co: "Colombia's ccTLD, but overwhelmingly used as a generic .com alternative."
    me: "Montenegro's ccTLD, sold worldwide as a vanity domain."
    tv: "Tuvalu's ccTLD (an LDC), sold worldwide for television and media sites."
    ly: "Libya's ccTLD, used for verb-ending vanity domains such as bit.ly."
    io: "British Indian Ocean Territory, used worldwide by technology companies."
    am: "Armenia's ccTLD, sold as a vanity domain for radio and media."
    fm: "Micronesia's ccTLD, sold as a vanity domain for audio and radio."
    gs: "South Georgia and the South Sandwich Islands; effectively unused geographically."
    ag: "Antigua and Barbuda's ccTLD, sold as a vanity domain for agencies."
    is: "Iceland's ccTLD, sold as a vanity domain for the English verb 'is'."
    cc: "Cocos (Keeling) Islands, sold worldwide as a generic alternative."
    st: "Sao Tome and Principe's ccTLD (an LDC), sold as a vanity domain."
    ws: "Samoa's ccTLD, marketed worldwide as standing for 'website'."
    to: "Tonga's ccTLD, sold as a vanity domain for the English preposition 'to'."
    nr: "Nauru's ccTLD, sold as a vanity domain."
    gl: "Greenland's ccTLD, sold as a vanity domain."

# --------------------------------------------------------------------------
# Company-level country corrections.
#
# Where the snapshot's country_code is demonstrably wrong for a named company,
# the correction is recorded here with its evidence. These change BLOC
# assignment, not green labels, and each one is a factual correction rather
# than a judgement about the company's business.
#
# Ratified by the supervisor at build step 5.
# --------------------------------------------------------------------------
company_country_corrections:
  algenol-biofuel:
    to: USA
    from: RUS
    reason: >
      Algenol Biofuels operated from Fort Myers, Florida. The Russian attribution
      reflects the nationality of an investor, not the company's domicile. The
      green label is correct and unchanged; only the bloc assignment moves, which
      removes $25m from emerging-market green dollars and adds it to advanced
      economies. The correction runs AGAINST the project's thesis, which is why it
      is applied rather than left alone.
