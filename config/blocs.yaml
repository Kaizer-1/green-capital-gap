# config/blocs.yaml
# Country -> bloc assignment. CLAUDE.md §5.
#
# Blocs:
#   AE     Advanced Economies      = World Bank high-income
#   EM     Emerging Markets        = upper-middle + lower-middle + low income,
#                                    EXCLUDING China and EXCLUDING LDCs
#   CHINA  reported separately, always. It dominates EM aggregates and hides
#          everything else. Mirrors Climate Policy Initiative's own practice.
#   LDC    reported separately where n permits, footnoted where it does not
#
# Assignment is TIME-VARYING: a deal takes the bloc its country held in the
# year the deal closed. A deal in Poland in 2004 is not a deal in an advanced
# economy; a deal in Poland in 2013 is.

version: 1

# --------------------------------------------------------------------------
# Income-group -> bloc mapping. Keys are the normalised labels emitted by the
# OWID / World Bank historical income-groups series.
# --------------------------------------------------------------------------
income_group_to_bloc:
  high_income: AE
  upper_middle_income: EM
  lower_middle_income: EM
  low_income: EM

# Label normalisation for the OWID series, whose spellings vary by vintage.
income_label_normalise:
  "High-income countries": high_income
  "High income": high_income
  "High income: OECD": high_income
  "High income: nonOECD": high_income
  "Upper-middle-income countries": upper_middle_income
  "Upper middle income": upper_middle_income
  "Lower-middle-income countries": lower_middle_income
  "Lower middle income": lower_middle_income
  "Low-income countries": low_income
  "Low income": low_income

# --------------------------------------------------------------------------
# Separated groups. These override the income-derived bloc.
# --------------------------------------------------------------------------
china:
  # Mainland China only. Hong Kong, Macao and Taiwan are separate entries in
  # the snapshot's country_code field and are NOT folded into China; stated
  # in docs/METHODOLOGY.md.
  codes: [CHN]

# --------------------------------------------------------------------------
# UN Least Developed Countries. `from` defaults to 1971 (list inception);
# `graduated` is the year the country left the list. Membership is evaluated
# per deal year, so a graduate is LDC before its graduation year and EM after.
# Source: UN DESA / UN-OHRLLS LDC list. Verify against the cited source before
# the methodology section goes in.
# --------------------------------------------------------------------------
