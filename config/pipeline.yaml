# config/pipeline.yaml
# Single source of truth for paths, windows, thresholds and seeds.
# CLAUDE.md §12: no magic numbers in code. If a number matters, it lives here.

project:
  name: green-capital-gap
  title: "The Green Capital Gap: a deal-level analysis of cleantech venture funding in emerging economies"

# --------------------------------------------------------------------------
# Determinism (CLAUDE.md §2.4)
# --------------------------------------------------------------------------
seed: 20251001          # seeds numpy, random, and every bootstrap/resample
bootstrap_resamples: 10000

# --------------------------------------------------------------------------
# Paths — all relative to repo root, resolved by src/gcg/config.py
# --------------------------------------------------------------------------
paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  manifest: data/MANIFEST.md
  outputs: outputs
  figures: outputs/figures
  tables: outputs/tables
  findings: outputs/findings.json
  report_md: report/report.md
  report_pdf: report/report.pdf
  logs: logs/build.log
  stamps: .stamps

# --------------------------------------------------------------------------
# Analysis window (CLAUDE.md §7, window-level traps)
# --------------------------------------------------------------------------
window:
  # Headline window. Start 2000: pre-2000 coverage is too thin and the dot-com
  # distortion is irrelevant to the argument.
  start: "2000-01-01"
  # Truncate at 2012-12-31: the 2013 snapshot's final months are incomplete
  # because deals are recorded with a lag. The 2013 "crash" is a reporting
  # artefact, not a market event.
  end: "2012-12-31"
  # Widest window kept in the interim tables, so the censoring-artefact figure
  # can plot the uncensored tail without re-ingesting.
  uncensored_end: "2014-12-31"
  # Dates outside this range are impossible for this snapshot and are dropped
  # with a logged count, never clipped silently.
  plausible_min: "1990-01-01"
  plausible_max: "2014-12-31"
  # Cleantech 1.0 cycle markers used for figure annotation.
  events:
    gfc: 2008
    cleantech_bust: 2011
  # H2 difference-in-differences event boundary.
  did_post_from: 2009
  did_index_base_year: 2007

# --------------------------------------------------------------------------
# Deflation (CLAUDE.md §7, comparability)
# --------------------------------------------------------------------------
deflate:
  base_year: 2015
  # US GDP deflator. The Crunchbase amounts are USD-denominated, so the US
  # deflator is the correct series, not a country-specific one.
  series_code: NY.GDP.DEFL.ZS
  deflator_country: USA
  nominal_column: amount_usd_nominal
  real_column: amount_usd_real2015

# --------------------------------------------------------------------------
# Suppression / reporting thresholds (CLAUDE.md §9)
# --------------------------------------------------------------------------
thresholds:
  min_cell_n: 30            # cells below this are suppressed or flagged on the figure
  alpha: 0.05
  fdr_method: fdr_bh        # Benjamini-Hochberg across the full test family
  # H4: a founding cohort needs this many years of observable window before the
  # truncation to be usable for graduation analysis.
  min_cohort_followup_years: 3
  # Permalink join rate between the relational and flat Crunchbase datasets.
  # Measured at 0.973 at step 2, against the correct denominator (companies with
  # at least one deal row, NOT all 196,553 companies in objects.csv). The floor
  # is set to catch a regression in permalink normalisation, which drops the rate
  # by tens of points rather than by fractions, while leaving headroom for normal
  # variation. The first run of this check fired at 0.178 on a wrong denominator;
  # the denominator reasoning is recorded in the _join_diagnostic docstring.
  join_rate_floor: 0.90
  join_rate_expected: 0.97

# --------------------------------------------------------------------------
# Deduplication key (CLAUDE.md §7, row-level)
# --------------------------------------------------------------------------
dedupe_key:
  - object_id
  - funded_at
  - funding_round_type
  - raised_amount_usd

# --------------------------------------------------------------------------
# Instrument normalisation (CLAUDE.md §7: an explicit mapping, never a
# scattered .str.lower().str.replace() chain).
#
# IMPORTANT, established empirically at build step 2: `funding_round_code` is
# the real instrument field, not `funding_round_type`. The latter is a coarse
# 9-value rollup that collapses `seed` into `angel`, and buries `grant`,
# `debt_round`, `convertible` and `secondary_market` inside a single `other`
# bucket. Normalising from `funding_round_type` would have left H3 (instrument
# mix) untestable and H4 (seed graduation) unmeasurable.
#
# Precedence: `funding_round_code` wins; `funding_round_type` is a fallback for
# rows where the code is absent. The two disagree for a known minority of rows
# (type=series-a with code=seed, n=1419; type=angel with code=convertible,
# n=146). The conflict count is logged and reported in the methodology.
# --------------------------------------------------------------------------
round_types:
  primary_field: funding_round_code
  fallback_field: funding_round_type

  # funding_round_code -> canonical. Keys are lowercased/stripped raw values.
  normalise:
    seed: seed
    angel: angel
    a: series_a
    b: series_b
    c: series_c_plus
    d: series_c_plus
    e: series_c_plus
    f: series_c_plus
    g: series_c_plus
    h: series_c_plus
    unattributed: venture_unspecified
    partial: venture_unspecified
    debt_round: debt_financing
    grant: grant
    convertible: convertible_note
    private_equity: private_equity
    post_ipo_equity: post_ipo_equity
    post_ipo_debt: post_ipo_debt
    crowd: crowdfunding
    crowd_equity: crowdfunding
    secondary_market: secondary_market

  # funding_round_type -> canonical, used only when the code is absent.
  normalise_fallback:
    angel: angel
    seed: seed
    "series-a": series_a
    "series-b": series_b
    "series-c+": series_c_plus
    venture: venture_unspecified
    "private-equity": private_equity
    "post-ipo": post_ipo_equity
    crowdfunding: crowdfunding
    other: other

  # Instrument families for H3. Dilutive = sells equity now or on conversion.
  instrument_family:
    dilutive_venture:
      - angel
      - seed
      - series_a
      - series_b
      - series_c_plus
      - venture_unspecified
      - private_equity
      - post_ipo_equity
    non_dilutive:
      - grant
      - debt_financing
      - post_ipo_debt
    quasi_equity:
      - convertible_note
    other:
      - crowdfunding
      - secondary_market
      - other
      - unknown

  # H4 graduation ladder. Ordered. Only these count as stage events.
  stage_ladder:
    - seed
    - series_a
    - series_b
    - series_c_plus

  # Resolved from flags.fold_angel_into_seed; both specifications are run.
  # Step 2 established code=seed n=11608 and code=angel n=3239, so the two
  # specifications are well-powered and genuinely different.
  seed_entry_types_strict:
    - seed
  seed_entry_types_angel_inclusive:
    - seed
    - angel

# --------------------------------------------------------------------------
# H4 observation window carve-out.
#
# H4 conditions on sample ENTRY (a company that raised seed) and asks whether it
# graduated. Because both numerator and denominator are drawn from the same
# cohort, coverage growth over the period partly differences out, which the
# level-based hypotheses (H1, H2) cannot claim. That asymmetry is what justifies
# permitting H4 a longer observation window than the headline, and it is stated
# in the methodology BEFORE any H4 result is reported.
#
# The gain is an extra year of follow-up, which admits one further founding
# cohort. It is NOT about the extra raw deal count.
#
# Permitted because the step-2 censoring checks cleared both tests:
#   (i)  seasonality: December is 7.0-8.0% of deals in 2011-2012 but 3.8% in
#        2013, so the December 2013 dip is the snapshot cut, not a seasonal one.
#   (ii) disclosure backfill: the disclosed-amount rate is 88.99 / 88.61 / 88.44
#        for 2011 / 2012 / 2013, and Nov-Dec 2013 are among the highest monthly
#        rates in the series. Dollars are not differentially censored in 2013.
# --------------------------------------------------------------------------
h4:
  # Headline specification: identical to the project window.
  observation_window_end: "2012-12-31"
  # Reported secondary specification. Stops at 2013-11-30, excluding the
  # partial December the snapshot cut off.
  observation_window_end_secondary: "2013-11-30"
  secondary_spec_label: "extended observation window to 2013-11-30"

# --------------------------------------------------------------------------
# Amount null encoding (established empirically at build step 2).
# CLAUDE.md §7 warns that raised_amount_usd is "missing for a large minority of
# rows". In this snapshot that missingness is encoded as a literal 0.0, NOT as
# NaN: 6,000 of 52,928 deal rows. Treating 0 as a disclosed $0 round would
# corrupt every median, IQR and dollar total in the report.
# --------------------------------------------------------------------------
amounts:
  zero_means_undisclosed: true
  # 362 of those 6,000 rows carry a positive local-currency `raised_amount` with
  # no USD conversion. That is a distinct failure mode from a genuinely
  # undisclosed deal and gets its own attrition-ledger line. They are NOT
  # back-converted: doing so would need an unvetted historical FX source.
  track_fx_conversion_failures: true
  local_amount_field: raised_amount
  local_currency_field: raised_currency_code

# --------------------------------------------------------------------------
# Specification flags. Each is a judgement call that changes a headline number,
# so each is toggleable and each is run BOTH ways in robustness.py. The value
# here is the HEADLINE specification.
# --------------------------------------------------------------------------
flags:
  # Admit a standalone "Energy" taxonomy token as a generic green hit.
  # Never applied under Tier-A-strict. Dependence is quantified, not asserted.
  admit_bare_energy: true

  # H4 funnel entry gate. Folding angel rounds into "seed" inflates the funnel
  # denominator and depresses measured graduation rates. That effect is expected
  # to be larger in EM, where angel-only financing is more common, which biases
  # H4 TOWARD the thesis. The headline therefore uses strict seed, the
  # specification that does not flatter the hypothesis. The direction is verified
  # empirically at step 7; if the data reverses it the headline switches and the
  # text says so.
  fold_angel_into_seed: false

# --------------------------------------------------------------------------
# Tripwires. Diagnostics computed at build step 3 that change what the report is
# allowed to claim. Each is checked in code and logged; crossing one is a
# reporting decision, not a silent pass.
# --------------------------------------------------------------------------
tripwires:
  # If green deals depending solely on the bare-energy pattern fall below this
  # share of EM green deals, the sensitivity gets one line, not a section.
  bare_energy_em_share_trivial: 0.03

  # If `general_unspecified` exceeds this share of EM green companies, Figure 5
  # dies as a headline EM-vs-AE sub-domain comparison and is reframed: mix
  # conditional on having a specific sub-domain, with the unspecified rate
  # plotted as its own bar alongside.
  general_unspecified_em_share_max: 0.35

  # Nuclear is expected to be negligible in 2000-2012 venture data. Verified
  # empirically. At or below this n it gets a footnote and no appendix row, and
  # no robustness budget is spent on the nuclear veto.
  nuclear_trivial_n: 30

# --------------------------------------------------------------------------
sources:
  cb_relational:
    kind: kaggle
    handle: justinas/startup-investments
    auth: kaggle
    licence: CC BY 4.0
    expect_files:
      - funding_rounds.csv
      - objects.csv
    notes: >
      Relational Crunchbase 2013 Snapshot. funding_rounds.csv is deal-level
      (funded_at, raised_amount_usd, funding_round_type, funding_round_code).
      objects.csv carries permalink, category_code, tag_list, country_code,
      founded_at, status, short_description.

  cb_flat:
    kind: kaggle
    handle: arindam235/startup-investments-crunchbase
    auth: kaggle
    licence: CC BY 4.0
    expect_files:
      - investments_VC.csv
    encoding: latin-1          # NOT utf-8 (CLAUDE.md §7, file-level)
    strip_column_names: true   # column names carry leading/trailing whitespace
    notes: >
      Flat mirror of the same snapshot. Supplies the rich pipe-delimited
      category_list field that the relational dump's coarse category_code lacks.
    # Public mirror, used only with explicit user consent (CLAUDE.md §4).
    mirror_urls:
      - https://raw.githubusercontent.com/matthewquerdasi/Startups-Analysis/main/investments_VC.csv
      - https://raw.githubusercontent.com/matthewquerdasi/Startups-Analysis/master/investments_VC.csv
    mirror_requires_consent: true

  india:
    kind: kaggle
    handle: sudalairajkumar/indian-startup-funding
    auth: kaggle
    licence: CC0 / see Kaggle page
    notes: >
      Continuity probe only (report §7). Never pooled with Crunchbase: the
      taxonomies and amount conventions are not compatible.

  wb_income_groups:
    kind: http
    url: "https://ourworldindata.org/grapher/world-bank-income-groups.csv?csvType=full"
    filename: world-bank-income-groups.csv
    licence: CC BY 4.0 (Our World in Data / World Bank)
    notes: Time-varying income classification. Drives the bloc assignment.

  wb_country_meta:
    kind: http
    url: "https://api.worldbank.org/v2/country?format=json&per_page=400"
    filename: wb_country_meta.json
    licence: CC BY 4.0 (World Bank)
    notes: ISO-3 codes, region, current income level. Used for code validation.

  owid_co2:
    kind: http
    url: "https://raw.githubusercontent.com/owid/co2-data/master/owid-co2-data.csv"
    filename: owid-co2-data.csv
    licence: CC BY 4.0 (Our World in Data)
    notes: CO2 per capita for the H5 need indicators.

  wb_indicators:
    kind: worldbank_api
    url_template: "https://api.worldbank.org/v2/country/all/indicator/{code}?format=json&per_page=20000&date={start}:{end}"
    date_start: 1995
    date_end: 2024
    licence: CC BY 4.0 (World Bank)
    indicators:
      NY.GDP.MKTP.CD: gdp_current_usd
      NY.GDP.PCAP.CD: gdp_per_capita_usd
      SP.POP.TOTL: population
      EG.ELC.ACCS.ZS: electricity_access_pct
      EG.FEC.RNEW.ZS: renewable_energy_share_pct
      NY.GDP.DEFL.ZS: gdp_deflator

# --------------------------------------------------------------------------
# Figures (CLAUDE.md §8). Filenames are deterministic.
# --------------------------------------------------------------------------
figures:
  dpi: 300
  formats: [png, pdf]
  figsize_single: [7.2, 4.4]
  figsize_stacked: [7.2, 8.0]
  source_line: "Source: Crunchbase 2013 Snapshot (CC BY 4.0); author's calculations."
