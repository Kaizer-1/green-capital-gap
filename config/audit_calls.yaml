# config/audit_calls.yaml
#
# The differential-audit correction.
#
# The 28 emerging-market green companies were audited exhaustively. Advanced-
# economy green companies were audited only at the top of the funding
# distribution. That asymmetry biases TOWARD finding a gap, because false
# positives were removed more thoroughly from one bloc than the other.
#
# To measure it, 60 advanced-economy green companies were drawn AT RANDOM (not
# funding-ranked, so the estimate is unbiased with respect to deal size) using
# the project seed, and audited against the same standard. The sample is fixed
# and reproducible: seed 20251008, from 1,114 advanced-economy green companies.
#
# The standard applied is the same one used for the emerging-market set:
#   - tag soup          -> a green token among many unrelated tags, no green product
#   - wrong referent    -> the matched token means something else in context
#   - fossil rule       -> primary asset or product mix predominantly fossil
#   - not a venture     -> not a company, or not an operating business
#   - efficiency of ICE -> improving fossil combustion is not a green product
#                          (this is the rule that excluded SEDEMAC Mechatronics
#                          in the emerging-market set; applied symmetrically here)
#
# `unverified` means the record is too thin to judge. These are KEPT, exactly as
# Villgro and Scion Global were kept in the emerging-market set, because
# excluding on unverifiability preferentially deletes thinly-documented rows.
#
# STATUS: proposed by Claude, pending supervisor ratification. The headline does
# not depend on them -- it uses raw classifier output -- so these feed only the
# false-positive rate comparison and the curated robustness run.

ae_random_audit:
  sample_size: 60
  drawn_from: 1114
  seed: 20251008
  ranked: false

  false_positive:
    - permalink: fitnesskeeper
      reason: "RunKeeper fitness-tracking app. Matched 'Recycling', an erroneous Crunchbase tag. Wrong referent."
    - permalink: augmentra
      reason: "ViewRanger GPS navigation app. Matched 'Recycling' among leisure and mapping tags. Tag soup."
    - permalink: industrytrader-com
      reason: "Industrial equipment classifieds marketplace. 'Clean Energy' is one of eight unrelated tags. Tag soup, identical to the GATe Technology exclusion."
    - permalink: mit-energy-initiative
      reason: "A university research programme, not an operating company. Not a venture."
    - permalink: luca-technologies
      reason: "Biogenic coalbed methane. Fossil rule. Already ratified for exclusion."
    - permalink: prometheus-energy
      reason: "Liquefied natural gas and methane fuel production. Fossil rule."
    - permalink: primoris-energy-solutions
      reason: "Operates an 'eco-friendly' auto repair shop. Matched on 'eco-friendly'. Wrong referent."
    - permalink: transonic-combustion
      reason: "Fuel injection systems improving gasoline-engine efficiency. Efficiency of internal combustion, the same rule that excluded SEDEMAC Mechatronics."
    - permalink: roc2loc
      reason: "Mobile lock and access hardware. Only taxonomy content is 'Mobile'; the cleantech flag has no support in the record."

  unverified_kept:
    - permalink: weaver-express
      reason: "Bare 'Clean Technology' tag, no other content, no disclosed funding. Unverifiable either way."
    - permalink: nps
      reason: "Ambiguous initials with a bare 'Clean Technology' tag. Unverifiable."
    - permalink: orecon
      reason: "Bare 'Clean Technology' tag. The name matches a UK wireless-semiconductor firm, but the record cannot confirm it."
    - permalink: sensortran
      reason: "Fibre-optic distributed temperature sensing, matched via an 'Energy' tag. The technology is widely deployed in oil and gas wells, but the record does not state the end market."
    - permalink: transatomic-power-corporation
      reason: "Molten-salt nuclear reactor startup. Retained because the nuclear veto is scoped to the generic tier only and this company carries the snapshot's own cleantech flag. The config is being followed, not overridden."

  # Everything else in the sample was judged a true positive. Named here so the
  # audit is a complete record rather than a list of rejections.
  true_positive_notes:
    - "Solazyme, Solix Biofuels, Targeted Growth: algal and crop-derived biofuels."
    - "Recurrent Energy, Nautilus Solar, Sunpreme, Sungevity, SkyFuel, Whitfield Solar, SunLink, Solar Components, Ascent Solar, Optony, BrightView Systems: solar."
    - "3POWER Energy, Havgul Clean Energy, Havkraft, Ocean Renewable Power: renewable generation."
    - "Lunera Lighting, Lucibel, Powerhouse Dynamics, Radiator Labs, Nexus EnergyHomes, ENBALA Power Networks, Agile Energy, Consolidated Energy, Power Innovations: efficiency, lighting and grid."
    - "ecoATM, Agilyx, Ze-gen: waste, recycling and waste-to-energy."
    - "Skyonic, EcoVadis, Ecometrica, Eco Power Solutions, EcoSMART Technologies: carbon and environmental monitoring."
    - "Akvo: water and sanitation."
    - "Zinc Air, FlexEl, Horizon Fuel Cell: storage and fuel cells."
    - "Vita Products: biodegradable horticultural products."
    - "The New Forests Company: forestry and afforestation."
    - "Algenol Biofuel: algae biofuel; country corrected to USA, so it appears in this bloc."
    - "Navatek Alternative Energy, xF Technologies, LoraxAg, BlueView Technologies, Solix: cleantech-flagged with corroborating content."

# The emerging-market census, for the comparison. Six of 28 companies were
# excluded on ratification (Quippo, SEDEMAC, Wifinity, GATe, Aventones, KSK).
em_census:
  # The denominator is NOT written here. It was, as 28, and it went stale: the
  # Algenol Biofuel country correction (blocs.yaml) moved that company to the
  # advanced-economy bloc, leaving 27. A census claim is a claim about the whole
  # population, so the population has to be counted from the data every run.
  # audit_symmetry.py counts it and fails the build if the named companies below
  # are not all present in it.
  excluded_companies:
    - quippo-infrastructure
    - sedemac-mechatronics
    - wifinity-technology
    - gate-technology
    - aventones
    - ksk-power-venture

  # Companies that left the census denominator for a reason other than exclusion.
  # Recorded so the count reconciles against the original audit of 28.
  reclassified:
    - permalink: algenol-biofuel
      reason: >
        Audited as emerging-market and judged correctly green. The country
        correction then moved it to the advanced-economy bloc, so it leaves the
        emerging-market denominator without being a false positive.

  # Utility-scale generation and independent power producers among the census.
  # The instrument-mix bias argument (METHODOLOGY.md §11) turns on how many of
  # these there are, because project finance for generation is debt or
  # concessional in substance while the round is coded as equity. Named here so
  # the count in the report is counted rather than asserted.
  utility_scale:
    - permalink: ksk-power-venture
      reason: "Independent power producer; thermal-heavy generation portfolio."
    - permalink: azure-power
      reason: "Utility-scale solar independent power producer."
    - permalink: isagen
      reason: "Utility-scale generation company, predominantly hydro."
    - permalink: sunborne-energy
      reason: "Utility-scale solar project developer."
    - permalink: akenerji-elektrik-uretim
      reason: "Electricity generation utility."
    - permalink: greenko-group
      reason: "Renewable independent power producer."
    - permalink: auro-mira-energy
      reason: "Renewable independent power producer."
