# config/green_lexicon.yaml
# The green classifier. CLAUDE.md §6: three tiers, kept separable, no pattern
# hard-coded in Python. Every regex is case-insensitive and word-boundaried.
#
# Headline definition:  green = TierA OR (TierB AND NOT TierC)
#
# Design note, stated in docs/METHODOLOGY.md:
#   The bare token "green" is deliberately NOT a trigger. "Green" is a common
#   surname and place name, so admitting it and then trying to subtract the false
#   positives in Tier C is a losing game. Only green-compounds trigger.

version: 1
case_sensitive: false

# --------------------------------------------------------------------------
# Tier A — strict. The snapshot's own coarse sector flag.
# --------------------------------------------------------------------------
tier_a:
  field: category_code
  values:
    - cleantech

# --------------------------------------------------------------------------
# Tier B — lexicon. Matched over the concatenation of these fields. Fields
# absent from the joined table are skipped with a logged warning, never
# silently ignored.
# --------------------------------------------------------------------------
match_fields:
  - category_list      # flat mirror: rich pipe-delimited taxonomy
  - category_code      # relational: coarse single bucket
  - tag_list           # relational: free tags
  - short_description  # relational: one-line blurb
  - market             # flat mirror (column name arrives whitespace-padded)

# A company may hit several sub-domains. All hits are retained in
# `green_subdomains_all`; the primary label is the first match in this
# priority order, most specific first. Generic terms rank last so that a
# company tagged "Cleantech|Solar" is counted as solar, not as general.
subdomain_priority:
  - solar
  - wind_hydro_geo
  - biofuels_biomass
  - energy_storage_battery
  - electric_mobility
  - energy_efficiency_smart_grid
  - water_sanitation
  - waste_recycling_circular
  - sustainable_agriculture
  - green_building_materials
  - environmental_monitoring_carbon
  - general_unspecified

subdomains:

  solar:
    label: "Solar"
    patterns:
      - '\bsolar\s*(power|energy|panel|panels|pv|thermal|cell|cells|farm|module|modules|water\s*heat\w*)?\b'
      - '\bphotovoltaic(s)?\b'
      - '\bsolar\s*pv\b'
      - '\bconcentrated\s*solar\b'
      - '\bcsp\b'
      - '\bthin[-\s]?film\s*solar\b'
    # \bsolar\b does not match "solarium" or "Solaris" (the following letter is
    # a word character, so the trailing boundary fails). Recorded in exclusions
    # anyway as an explicit audit trail.

  wind_hydro_geo:
    label: "Wind, hydro and geothermal"
    patterns:
      - '\bwind\s*(power|energy|turbine|turbines|farm|farms|generation)\b'
      - '\bwind\b(?=\s*(?:\||,|$))'
      - '\boffshore\s*wind\b'
      - '\bhydro\b'
      - '\bhydro[-\s]?(power|electric|electricity|kinetic)\b'
      - '\bmicro[-\s]?hydro\b'
      - '\bgeothermal\b'
      - '\btidal\s*(power|energy)?\b'
      - '\bwave\s*(power|energy)\b'
      - '\bmarine\s*energy\b'
    # \bwind\b cannot match "window" or "windows". The lookahead variant admits
    # a bare "Wind" only when it stands alone as a taxonomy token.

  biofuels_biomass:
    label: "Biofuels and biomass"
    patterns:
      - '\bbio[-\s]?fuel(s)?\b'
      - '\bbio[-\s]?diesel\b'
      - '\bbio[-\s]?ethanol\b'
      - '\bethanol\b'
      - '\bbio[-\s]?mass\b'
      - '\bbio[-\s]?gas\b'
      - '\bbio[-\s]?energy\b'
      - '\bbio[-\s]?refiner(y|ies)\b'
      - '\balgae\b'
      - '\balgal\s*(fuel|biofuel)\b'
      - '\bbiochar\b'
      - '\banaerobic\s*digest\w*\b'
      - '\bwaste[-\s]?to[-\s]?energy\b'
      - '\bcellulosic\b'
      - '\bjatropha\b'

  energy_storage_battery:
    label: "Energy storage and batteries"
    patterns:
      - '\bbatter(y|ies)\b'
      - '\benergy\s*storage\b'
      - '\bgrid\s*storage\b'
      - '\bfuel\s*cell(s)?\b'
      - '\blithium[-\s]?ion\b'
      - '\bli[-\s]?ion\b'
      - '\bflow\s*batter(y|ies)\b'
      - '\b(super|ultra)[-\s]?capacitor(s)?\b'
      - '\bhydrogen\s*(fuel|storage|energy|production)?\b'
      - '\bthermal\s*storage\b'

  energy_efficiency_smart_grid:
    label: "Energy efficiency and smart grid"
    patterns:
      - '\benergy\s*efficien\w*\b'
      - '\benergy\s*management\b'
      - '\benergy\s*monitoring\b'
      - '\bsmart\s*grid\b'
      - '\bsmart\s*meter\w*\b'
      - '\bdemand\s*response\b'
      - '\bdemand[-\s]?side\s*management\b'
      - '\bmicro[-\s]?grid(s)?\b'
      - '\bbuilding\s*(energy\s*)?(automation|management)\b'
      - '\bled\s*lighting\b'
      - '\bsolid[-\s]?state\s*lighting\b'
      - '\bpower\s*management\b'
      - '\bcogeneration\b'
      - '\bcombined\s*heat\s*and\s*power\b'
      - '\bdistributed\s*generation\b'

  electric_mobility:
    label: "Electric mobility"
    patterns:
      - '\belectric\s*(vehicle(s)?|car(s)?|bus(es)?|truck(s)?|scooter(s)?|motorcycle(s)?|bike(s)?|bicycle(s)?|drivetrain|powertrain|mobility)\b'
      - '\be[-\s]?mobility\b'
      - '\bev\s*charg\w*\b'
      - '\bcharging\s*(station|stations|infrastructure|network)\b'
      - '\bplug[-\s]?in\s*hybrid\b'
      - '\bhybrid\s*(vehicle|car|drivetrain|powertrain)s?\b'
      - '\bbike[-\s]?shar\w*\b'
      - '\bcar[-\s]?shar\w*\b'
    # Bare "EV" is deliberately excluded as a trigger: two letters, far too
    # many unrelated expansions in free-text tag fields.

  water_sanitation:
    label: "Water and sanitation"
    patterns:
      - '\bwater\s*(treatment|purification|filtration|quality|conservation|management|recycling|reuse|technolog\w*|infrastructure)\b'
      - '\bwaste[-\s]?water\b'
      - '\bdesalinat\w*\b'
      - '\bsanitation\b'
      - '\bdrinking\s*water\b'
      - '\bclean\s*water\b'
      - '\bpotable\s*water\b'
      - '\bwater\s*scarcity\b'
      - '\bgrey[-\s]?water\b'

  waste_recycling_circular:
    label: "Waste, recycling and circular economy"
    patterns:
      - '\brecycl\w*\b'
      - '\bwaste\s*(management|reduction|collection|disposal|treatment|diversion|sorting)\b'
      - '\b(solid|organic|industrial|municipal|hazardous)\s*waste\b'
      - '\be[-\s]?waste\b'
      - '\blandfill\b'
      - '\bcompost\w*\b'
      - '\bcircular\s*economy\b'
      - '\bupcycl\w*\b'
      - '\bzero\s*waste\b'
      - '\bremanufactur\w*\b'
    # \bwaste\b alone is not a trigger, so "wasteland" and "waste of time"
    # cannot match; only waste-compounds do.

  sustainable_agriculture:
    label: "Sustainable agriculture"
    patterns:
      - '\bsustainable\s*(agriculture|farming|food|fisher\w*|aquaculture)\b'
      - '\bag[-\s]?tech\b'
      - '\bagri[-\s]?tech\b'
      - '\bprecision\s*(agriculture|farming)\b'
      - '\bagroforestry\b'
      - '\bpermaculture\b'
      - '\borganic\s*(farm\w*|agriculture|food|produce)\b'
      - '\bvertical\s*farm\w*\b'
      - '\bhydroponic\w*\b'
      - '\baquaponic\w*\b'
      - '\bsoil\s*(health|carbon|quality)\b'
      - '\bdrip\s*irrigation\b'
      - '\bmicro[-\s]?irrigation\b'
      - '\bcrop\s*(yield|monitoring)\b'
    # "organic" alone is not a trigger: "organic search", "organic growth" and
    # "organic traffic" are ubiquitous in startup tag fields.

  green_building_materials:
    label: "Green building and materials"
    patterns:
      - '\bgreen\s*(building|buildings|construction|cement|concrete|roof\w*|infrastructure)\b'
      - '\bsustainable\s*(building|construction|materials|design|architecture)\b'
      - '\bleed\s*(certif\w*|rating)\b'
      - '\bpassive\s*house\b'
      - '\bnet[-\s]?zero\s*(building|energy)\b'
      - '\bbio[-\s]?plastic(s)?\b'
      - '\bbio[-\s]?material(s)?\b'
      - '\bbio[-\s]?degradable\b'
      - '\bcompostable\s*packaging\b'
      - '\bbuilding\s*insulation\b'
      - '\beco[-\s]?(friendly|material)\w*\b'

  environmental_monitoring_carbon:
    label: "Environmental monitoring and carbon"
    patterns:
      - '\bcarbon\s*(credit(s)?|offset(s)?|capture|sequestration|accounting|footprint|trading|market(s)?|neutral\w*|emission(s)?|pricing|tax)\b'
      - '\bccs\b'
      - '\bemission(s)?\s*(monitoring|reduction|trading|control)\b'
      - '\bcap\s*and\s*trade\b'
      - '\bair\s*(quality|pollution|monitoring)\b'
      - '\benvironmental\s*(monitoring|sensor\w*|data|compliance|remediation|services|technolog\w*)\b'
      - '\bpollution\s*(control|monitoring|reduction)\b'
      - '\bclimate\s*(tech\w*|change|adaptation|resilience|risk)\b'
      - '\bgreenhouse\s*gas\w*\b'
      - '\bghg\b'
      - '\blife[-\s]?cycle\s*assessment\b'
    # "carbon" alone is not a trigger: "carbon copy" and "Carbonite" exist.
    # "greenhouse gas" is required rather than bare "greenhouse" (the latter is
    # an HR software company and also ordinary horticulture).

# --------------------------------------------------------------------------
# Generic green terms. Establish greenness but carry no sub-domain, so they
# map to `general_unspecified` and rank last in subdomain_priority.
# --------------------------------------------------------------------------
general_unspecified:
  label: "Green, sub-domain unspecified"
  patterns:
    - '\bclean\s*tech\w*\b'
    - '\bcleantech\b'
    - '\bclean\s*(energy|power|technolog\w*)\b'
    - '\bgreen\s*tech\w*\b'
    - '\bgreentech\b'
    - '\bgreen\s*(energy|power|economy)\b'
    - '\brenewable(s)?\b'
    - '\brenewable\s*energy\b'
    - '\balternative\s*energy\b'
    - '\bsustainab\w*\b'
    - '\benvironmental\w*\b'
    - '\beco[-\s]?friendly\b'
    - '\bdecarbonis\w*\b'
    - '\bdecarboniz\w*\b'
    - '\bnatural\s*resources\b'
    - '\benergy\b(?=\s*(?:\||,|$))'

# --------------------------------------------------------------------------
# Tier C — exclusions. A Tier-B hit matching any `veto_all` pattern is dropped
# from the green set. `veto_subdomain` removes only that sub-domain label and
# leaves other hits standing. Every entry carries a reason; the list is the
# audit trail and is reprinted verbatim as Appendix A of the report.
# --------------------------------------------------------------------------
exclusions:

  - pattern: '\b(dry[-\s]?clean\w*|clean\w*\s*service(s)?|house\s*clean\w*|office\s*clean\w*|janitorial|laundry)\b'
    scope: veto_all
    reason: "Cleaning and laundry services. 'clean' in a services sense, not an energy sense."

  - pattern: '\bcleaner(s)?\b'
    scope: veto_all
    reason: "Cleaning products or staff, not clean technology."

  - pattern: '\bgreenhouse\b(?!\s*gas)'
    scope: veto_all
    reason: "Greenhouse Software (recruiting ATS) and ordinary horticulture. Only 'greenhouse gas' is a green signal."

  - pattern: '\bgreeting(s)?\b'
    scope: veto_all
    reason: "Greeting cards. Substring collision with 'green'."

  - pattern: '\b(solaris|solarium|solariums)\b'
    scope: veto_all
    reason: "Solaris (operating system) and tanning salons. Word boundaries already prevent the match; logged for completeness."

  - pattern: '\bwindow(s|ing)?\b'
    scope: veto_subdomain
    subdomain: wind_hydro_geo
    reason: "'Windows' / 'window' is not wind power. Boundaries prevent it; retained as an explicit guard."

  - pattern: '\bwasteland\b'
    scope: veto_subdomain
    subdomain: waste_recycling_circular
    reason: "Figurative use, not waste management."

  - pattern: '\borganic\s*(search|traffic|growth|reach|install\w*)\b'
    scope: veto_subdomain
    subdomain: sustainable_agriculture
    reason: "Marketing jargon, not organic agriculture."

  - pattern: '\b(carbon\s*copy|carbonite|carbon\s*fiber|carbon\s*fibre)\b'
    scope: veto_subdomain
    subdomain: environmental_monitoring_carbon
    reason: "Carbon Copy (software), Carbonite (backup), carbon fibre (materials, not emissions)."

  - pattern: '\b(greentech\s*media|cleantech\s*group|cleantech\s*open|cleantechnica|renewable\s*energy\s*world|environmental\s*leader)\b'
    scope: veto_all
    reason: "Trade media, conference organisers and analyst firms. They report on the sector; they are not in it."

  - pattern: '\b(conference(s)?|trade\s*show|media\s*compan\w*|magazine|publisher|publishing|news\s*(site|portal|outlet))\b.*\b(cleantech|greentech|renewable)\b'
    scope: veto_all
    reason: "Sector media and events businesses. Their capital is not green-venture capital."

  - pattern: '\b(carbon\s*black)\b'
    scope: veto_all
    reason: "Carbon Black, the endpoint-security company."

  - pattern: '\b(oil\s*(and|&)?\s*gas|petroleum|petrochemical\w*|upstream\s*oil|oilfield|drilling|fracking|hydraulic\s*fracturing|shale\s*(oil|gas)|coal\s*(mining|fired|power)|tar\s*sands|oil\s*sands|natural\s*gas\s*(production|exploration)|refiner(y|ies)\s*services|lng\s*terminal)\b'
    scope: veto_all
    reason: >
      Fossil-fuel extraction, refining and coal power. Necessary because the
      general tier admits a standalone 'Energy' taxonomy token and Crunchbase's
      'Energy' bucket mixes renewables with oil, gas and coal. Without this veto
      an upstream petroleum company classifies as green. Note the deliberate
      asymmetry: 'biorefinery' and 'hydrogen' remain green, 'refinery services'
      and 'natural gas production' do not.

  - pattern: '\b(nuclear\s*(power|energy|reactor|fission)|uranium)\b'
    scope: veto_subdomain
    subdomain: general_unspecified
    reason: >
      Nuclear is contested as 'green' and is outside the Cleantech 1.0 venture
      taxonomy this report analyses. Vetoed from the generic tier only, so a
      nuclear firm is not admitted on a bare 'Energy' token, while an explicit
      renewables or storage hit still counts. Sensitivity of the headline results
      to this choice is reported in the robustness appendix.

  - pattern: '\bbattery\s*park\b'
    scope: veto_subdomain
    subdomain: energy_storage_battery
    reason: "Battery Park is a place name in Manhattan."

  - pattern: '\bhydro\s*flask\b'
    scope: veto_subdomain
    subdomain: wind_hydro_geo
    reason: "Hydro Flask, a drinks-bottle brand."

# --------------------------------------------------------------------------
# Manual exclusions, by Crunchbase permalink slug. Populated at build step 3
# by eyeballing the 150 highest-funded Tier-B-only companies (CLAUDE.md §6).
# Each entry needs a one-line reason. Defensible hand-curation; the audit
# trail is the point. EMPTY UNTIL THE AUDIT HAS ACTUALLY BEEN RUN.
# --------------------------------------------------------------------------
manual_exclusions: []

# Companies the audit confirms as genuinely green despite looking marginal.
# Recorded so the decision is visible, not just the rejections.
manual_inclusions: []
